config:
  warningsAsErrors: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  MaxLineLength:
    excludes: ['**/test/**', '**/androidTest/**']
  UnusedPrivateFunction:
    ignoreAnnotated:
      - 'Preview'
  MagicNumber:
    ignorePropertyDeclaration: true
  UnusedImport:
    active: true
  WildcardImport:
    active: true

Compose:
  active: true
